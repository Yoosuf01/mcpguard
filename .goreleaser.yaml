version: 2

project_name: mcpguard

builds:
  - id: mcpguard
    dir: shield
    main: ./cmd/shield
    binary: mcpguard
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/Yoosuf01/mcpguard/shield/internal/version.Version={{.Version}}
      - -X github.com/Yoosuf01/mcpguard/shield/internal/version.Commit={{.Commit}}
      - -X github.com/Yoosuf01/mcpguard/shield/internal/version.BuildDate={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - NOTICE
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
