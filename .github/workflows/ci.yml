name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shield:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shield
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: shield/go.mod
          cache-dependency-path: shield/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race -count=1 ./...
      - name: exploit demo
        run: ./examples/exploit-demo/demo.sh
