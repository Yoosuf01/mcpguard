{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcpguard.fullname" . }}-secrets
  labels:
    {{- include "mcpguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-token: {{ .Values.secrets.adminToken | quote }}
  jwt-hs256-secret: {{ .Values.secrets.jwtHs256Secret | quote }}
  {{- if .Values.secrets.redisPassword }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.postgresPassword }}
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  {{- end }}
{{- end }}

